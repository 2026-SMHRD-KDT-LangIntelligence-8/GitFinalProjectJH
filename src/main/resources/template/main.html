<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 메뉴</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="phone-frame">
    <div class="top-header">
        <img src="/img/login-logout.png" alt="로그인 로고" class="login-logo">
        <div class="auth-box">
            <a href="login.html" id="loginLink" class="login-btn">로그인</a>
            <span id="authDivider" class="divider"></span>
            <a href="#" id="logoutLink" class="login-btn">로그아웃</a>
        </div>
    </div>

    <div class="title-container">
        <img src="/img/logo.png" alt="서비스 로고" class="service-logo">
        <h1 class="service-title">인지검사</h1>
    </div>

    <div class="menu-container">
        <a href="manage_seniors.html" class="menu-item bg-1">수급자 관리</a>
        <a href="test.html" class="menu-item bg-2">인지능력 검사</a>
        <a href="training.html" class="menu-item bg-3">인지능력 훈련</a>
        <a href="report.html" class="menu-item bg-4">리포트</a>
        <a href="profile_edit.html" class="menu-item bg-5">개인정보수정</a>
    </div>

    <a href="https://www.esthermall.co.kr/..." target="_blank" class="premium-ad-box">
        <span class="hot-badge">특가</span>
        <div class="ad-info">
            <div class="tag-row"><span class="ad-category">정부지원/시니어몰</span></div>
            <p class="ad-main-title">부모님 두뇌 영양제 베스트 5</p>
            <p class="ad-price-info">최대 45% 할인 + 무료 배송</p>
            <p class="ad-sub-text">인지력 개선 기능성 원료 엄선</p>
        </div>
        <div class="shop-go-btn">보러가기</div>
    </a>
</div>

<script>
    const AUTH_STORAGE_KEY = 'isLoggedIn';
    const KAKAO_LOGOUT_URL = '/logout';
    const loginLink = document.getElementById('loginLink');
    const logoutLink = document.getElementById('logoutLink');
    const authDivider = document.getElementById('authDivider');

    function syncLoginStateFromUrl() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('login') === 'success') {
            localStorage.setItem(AUTH_STORAGE_KEY, 'true');
            window.history.replaceState({}, document.title, '/main.html');
        }
    }
<!--로그인 상태 확인 후, 로그인 및 로그아웃 버튼 표시 여부 변경-->
    function updateAuthUi() {
        const isLoggedIn = localStorage.getItem(AUTH_STORAGE_KEY) === 'true';
        loginLink.classList.toggle('hidden', isLoggedIn);
        logoutLink.classList.toggle('hidden', !isLoggedIn);
        authDivider.classList.add('hidden');
    }

    logoutLink.addEventListener('click', (event) => {
        event.preventDefault();
        localStorage.removeItem(AUTH_STORAGE_KEY);
        window.location.href = KAKAO_LOGOUT_URL;
    });

    syncLoginStateFromUrl();
    updateAuthUi();
</script>
</body>
</html>
