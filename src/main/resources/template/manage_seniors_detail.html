<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수급자 상세 관리</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="phone-frame">

    <div class="top-nav-bar">
        <a href="manage_seniors.html" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            뒤로가기
        </a>
        <h1 class="page-title">수급자 관리</h1>
        <div style="width: 50px;"></div>
    </div>

    <div class="scroll-content">

        <!-- ① 기초 정보 구역 -->
        <div class="info-section">
            <div class="section-label-row">
                <h2 class="section-title">기초 정보</h2>
                <span class="section-badge-info">Profile</span>
            </div>

            <div class="info-form-layout">
                <div class="form-item-row">
                    <span class="form-lbl">수급자명</span>
                    <span class="form-val" id="val-name"></span>
                </div>

                <div class="form-item-row">
                    <span class="form-lbl">생년월일</span>
                    <input type="text" class="date-input-field" id="val-keypad" placeholder="예: 2026052" maxlength="10">
                </div>

                <div class="form-item-row">
                    <span class="form-lbl">성별</span>
                    <select class="toggle-select" id="toggle-gender">
                        <option value="">선택</option>
                        <option value="male">남성</option>
                        <option value="female">여성</option>
                    </select>
                </div>

                <div class="form-item-row">
                    <span class="form-lbl">장기요양등급</span>
                    <select class="toggle-select" id="toggle-grade">
                        <option value="">등급 선택</option>
                        <option value="1">1등급</option>
                        <option value="2">2등급</option>
                        <option value="3">3등급</option>
                        <option value="4">4등급</option>
                        <option value="5">5등급</option>
                        <option value="6">인지지원등급</option>
                    </select>
                </div>

                <div class="form-item-row">
                    <span class="form-lbl">비상연락망</span>
                    <span class="form-val" id="val-phone"></span>
                </div>
                <div class="form-item-row">
                    <span class="form-lbl">검사 횟수</span>
                    <span class="form-val" id="val-count" style="color: #2e6f40;"></span>
                </div>
                <div class="form-item-row">
                    <span class="form-lbl">최근 검사일</span>
                    <span class="form-val" id="val-date"></span>
                </div>
            </div>

            <div class="btn-align-right">
                <button type="button" class="edit-action-btn">편집</button>
            </div>
        </div>

        <!-- ③ 훈련 현황 조회 구역 -->
        <div class="info-section">
            <div class="section-label-row">
                <h2 class="section-title">훈련 현황 조회</h2>
                <span class="section-badge-info">Status</span>
            </div>
            <div class="card-panel h-blank-medium"></div>
        </div>

        <!-- ④ 이전 리포트 보기 구역 -->
        <div class="info-section">
            <div class="section-label-row">
                <h2 class="section-title">이전 리포트 보기</h2>
                <span class="section-badge-info">History</span>
            </div>
            <div class="card-panel h-blank-medium"></div>
        </div>

        <!-- ⑤, ⑥ 기간별 변화 구역 -->
        <div class="info-section">
            <div class="section-label-row">
                <h2 class="section-title">기간별 변화</h2>
                <select class="select-period-box">
                    <option>기간 설정</option>
                    <option>최근 1주일</option>
                    <option>최근 1개월</option>
                    <option>최근 3개월</option>
                </select>
            </div>
            <div class="card-panel h-blank-large"></div>
        </div>

        <!-- ⑦, ⑧ 기타 특이사항 구역 -->
        <div class="info-section">
            <div class="section-label-row">
                <h2 class="section-title">기타 특이사항</h2>
                <span class="section-badge-info">Memo</span>
            </div>
            <div class="card-panel h-blank-medium"></div>

            <div class="btn-align-right">
                <button type="button" class="edit-action-btn">편집</button>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('val-keypad').addEventListener('blur', function(e) {
        let value = e.target.value.replace(/[^0-9]/g, '');
        let y = "", m = "", d = "";

        if (value.length === 0) {
            e.target.value = '';
            return;
        }

        if (value.length === 8) {
            y = value.substring(0, 4);
            m = value.substring(4, 6);
            d = value.substring(6, 8);
        }
        else if (value.length === 7) {
            y = value.substring(0, 4);
            let rest = value.substring(4);

            if (rest.startsWith('0')) {
                m = rest.substring(0, 2);
                d = '0' + rest.substring(2, 3);
            } else {
                m = '0' + rest.substring(0, 1);
                d = rest.substring(1, 3);
            }
        }
        else if (value.length === 6) {
            let prefix = parseInt(value.substring(0, 2)) > 30 ? "19" : "20";
            y = prefix + value.substring(0, 2);
            m = value.substring(2, 4);
            d = value.substring(4, 6);
        }
        else if (value.length === 5) {
            let prefix = parseInt(value.substring(0, 2)) > 30 ? "19" : "20";
            y = prefix + value.substring(0, 2);
            let rest = value.substring(2);

            if (rest.startsWith('0')) {
                m = rest.substring(0, 2);
                d = '0' + rest.substring(2, 3);
            } else {
                m = '0' + rest.substring(0, 1);
                d = rest.substring(1, 3);
            }
        }
        else if (value.length === 4) {
            let prefix = parseInt(value.substring(0, 2)) > 30 ? "19" : "20";
            y = prefix + value.substring(0, 2);
            m = '0' + value.substring(2, 3);
            d = '0' + value.substring(3, 4);
        }
        else if (value.length === 3) {
            y = new Date().getFullYear();
            if (value.startsWith('0')) {
                m = value.substring(0, 2);
                d = '0' + value.substring(2, 3);
            } else {
                m = '0' + value.substring(0, 1);
                d = value.substring(1, 3);
            }
        } else if (value.length === 2) {
            y = new Date().getFullYear();
            m = '0' + value.substring(0, 1);
            d = '0' + value.substring(1, 2);
        } else {
            return;
        }

        e.target.value = `${y}-${m}-${d}`;
    });
</script>

</body>
</html>
