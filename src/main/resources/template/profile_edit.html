<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보수정</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="phone-frame">
  <!-- 💡 뒤로가기 버튼 영역 추가 -->
  <div class="top-nav-bar">
    <a href="main.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7" />
      </svg>
      뒤로가기
    </a>
  </div>

  <div class="header-wrapper">
    <h2 class="page-title">개인정보수정</h2>
  </div>

  <div class="edit-form-container">
    <div class="form-row">
      <div class="form-label">이름</div>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" placeholder="이름을 입력하세요">
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">이메일</div>
      <div class="form-input-wrapper">
        <input type="email" class="form-input" placeholder="example@email.com">
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">전화번호</div>
      <div class="form-input-wrapper">
        <input type="tel" class="form-input" placeholder="010-0000-0000">
      </div>
    </div>
  </div>

  <div class="security-notice-box">
    <div class="security-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <div class="security-text">
      귀하의 모든 개인정보는 암호화 처리되며<br>안전하게 분리 보관됩니다.
    </div>
  </div>

  <div class="action-button-group">
    <button type="submit" class="primary-btn">수정하기</button>
    <button type="button" class="secondary-btn">탈퇴하기</button>
  </div>

</div>

</body>
</html>
