<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <style>
        @import url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2206-02@1.0/PyeongChangPeace-Bold.woff2');

        /* 1. 배경 화면 스타일 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        /* 2. 스마트폰 모양 틀 (360x740) */
        .phone-frame {
            width: 360px;
            height: 740px;
            border: 2px solid #EFEFEF;
            border-radius: 40px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 30px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, #ffffff 30%, #f4fbf6 70%, #dcedf0 100%);
        }

        /* 3. 로고 영역 */
        .logo-box {
            text-align: center;
            z-index: 1;
            margin-top: 20px;
            margin-bottom: 1px;
            position: relative;
            width: 100%;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-bg {
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(220,245,225,0.7) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            z-index: -1;
        }

        .logo-img {
            width: 180px;
            height: auto;
            object-fit: contain;
        }

        /* 4. 문구 디자인 영역 */
        .welcome-box {
            text-align: center;
            width: 100%;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: -30px;
        }

        .main-title {
            font-family: 'PyeongChangPeace-Bold', sans-serif;
            font-size: 21px;
            font-weight: 500;
            color: #555555;
            margin: 0;
            letter-spacing: -0.5px;
            line-height: 1.5;
            word-break: keep-all;
            margin-top: 1px;
        }

        .main-title .highlight {
            display: inline-block;
            font-size: 27px;
            color: #97DA9D;
            font-weight: 700;
            margin-top: 1px;
            position: relative;
        }

        .divider {
            width: 60px;
            height: 1px;
            background-color: #D6D6D6;
            margin: 22px auto;
            border: none;
        }

        .sub-title {
            font-size: 15px;
            font-weight: 400;
            color: #666666;
            margin: 0;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 5. 카카오 로그인 버튼 스타일 */
        .kakao-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 60px;
            background-color: #FEE500;
            color: #191919;
            text-decoration: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 16px rgba(254, 229, 0, 0.3);
            transition: all 0.2s ease;
            gap: 12px;
            z-index: 1;
            margin-bottom: 50px;
        }

        .kakao-icon {
            width: 22px;
            height: auto;
            object-fit: contain;
        }

        .kakao-btn:hover {
            transform: translateY(-1px);
            background-color: #FADA0A;
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <div class="logo-box">
        <div class="logo-bg"></div>
        <img class="logo-img" src="/img/logo.png" alt="서비스 로고">
    </div>

    <div class="welcome-box">
        <h2 class="main-title">
            말 한마디로 시작하는<br>
            <span class="highlight">똑똑한 인지 건강 관리</span>
        </h2>

        <div class="divider"></div>

        <p class="sub-title">서비스 이용을 위해 로그인이 필요합니다.</p>
    </div>

    <button class="kakao-btn" onclick="loginWithKakao()">
        <img class="kakao-icon" src="/img/icons카카오톡.png" alt="카카오톡 아이콘">
        카카오로 로그인
    </button>

</div>

<script>
    // 카카오api
    const KAKAO_LOGIN_URL = '/oauth2/authorization/kakao';

    // 카카오api
    function loginWithKakao() {
        window.location.href = KAKAO_LOGIN_URL;
    }
</script>

</body>
</html>
