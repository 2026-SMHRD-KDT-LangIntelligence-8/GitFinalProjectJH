<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개인정보수정</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

    body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f6f4;
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }

    /* 스마트폰 모양 틀 */
    .phone-frame {
        width: 360px;
        height: 740px;
        border: 2px solid #EFEFEF;
        border-radius: 40px;
        box-shadow: 0 14px 35px rgba(17, 56, 28, 0.08);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px 24px 44px 24px;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
        background-color: #ffffff;
    }

    /* 상단 타이틀 영역 */
    .header-wrapper {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin: 10px 0 36px 0;
        position: relative;
        width: 100%;
    }

    .brand-sub {
        font-size: 11px;
        font-weight: 700;
        color: #2e6f40;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 6px;
    }

    .page-title {
        font-size: 26px;
        font-weight: 800;
        color: #11381c;
        margin: 0;
        letter-spacing: -0.5px;
        position: relative;
        z-index: 2;
    }

    .page-title::before {
        content: '';
        position: absolute;
        left: -6px;
        bottom: -1px;
        width: 52px;
        height: 16px;
        background-color: rgba(46, 111, 64, 0.09);
        border-radius: 4px;
        z-index: -1;
    }

    /* 중앙: 정보 입력 폼 컨테이너 */
    .edit-form-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
    }

    .form-row {
        display: flex;
        align-items: center;
        width: 100%;
        height: 50px;
    }

    .form-label {
        width: 75px;
        font-size: 14.5px;
        font-weight: 800;
        color: #0d2b15;
        letter-spacing: -0.5px;
        flex-shrink: 0;
    }

    .form-input-wrapper {
        flex: 1;
        height: 100%;
    }

    .form-input {
        width: 100%;
        height: 100%;
        border: 1.5px solid #e2ece6;
        border-radius: 14px;
        padding: 0 16px;
        font-size: 14px;
        font-family: inherit;
        font-weight: 600;
        color: #11381c;
        box-sizing: border-box;
        outline: none;
        background-color: #f7faf8;
        box-shadow: inset 0 1.5px 3px rgba(17, 56, 28, 0.02);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .form-input:focus {
        border-color: #1e5e3a;
        background-color: #ffffff;
        box-shadow: 0 4px 14px rgba(30, 94, 58, 0.05);
    }

    /* 중간 보안 안심 라벨 */
    .security-notice-box {
        width: 100%;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        opacity: 0.85;
        animation: fadeIn 0.8s ease-out;
    }

    .security-icon {
        color: #2e6f40;
        background-color: rgba(46, 111, 64, 0.06);
        padding: 12px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .security-text {
        font-size: 12.5px;
        font-weight: 600;
        color: #728a7a;
        text-align: center;
        line-height: 1.4;
        letter-spacing: -0.3px;
    }

    /* 하단 버튼 그룹 */
    .action-button-group {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-top: 10px;
    }

    /* 수정하기 버튼 (기본 템플릿 규격) */
    .primary-btn {
        width: 100%;
        height: 50px;
        background: linear-gradient(135deg, #2e6f40 0%, #1e5e3a 100%);
        color: #ffffff;
        border: none;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(30, 94, 58, 0.15);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .primary-btn:hover {
        transform: translateY(-1.5px);
        box-shadow: 0 6px 16px rgba(30, 94, 58, 0.22);
    }

    .primary-btn:active {
        transform: translateY(0) scale(0.98);
        opacity: 0.95;
    }

    /* 🛠️ 탈퇴하기 버튼 (수정하기 버튼과 완벽하게 대칭되도록 높이 및 모션 동기화 완료) */
    .secondary-btn {
        width: 100%;
        height: 50px; /* 👈 기존 44px에서 50px로 일치 */
        background: linear-gradient(135deg, #c34343 0%, #922b2b 100%);
        color: #ffffff;
        border: none; /* 👈 선 굵기 편차 방지를 위해 보더 제거 후 그라데이션 일화 */
        border-radius: 14px; /* 👈 기존 12px에서 14px로 일치 */
        font-size: 15px; /* 👈 폰트 사이즈 통일 */
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(146, 43, 43, 0.15);
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        box-sizing: border-box;
    }

    .secondary-btn:hover {
        transform: translateY(-1.5px); /* 👈 수정하기와 호버 도약 높이 통일 */
        background: linear-gradient(135deg, #a83535 0%, #7a2222 100%);
        box-shadow: 0 6px 16px rgba(146, 43, 43, 0.22);
    }

    .secondary-btn:active {
        transform: translateY(0) scale(0.98); /* 👈 클릭 시 스케일 변화율 통일 */
        opacity: 0.95;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 0.85; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="phone-frame">

  <div class="header-wrapper">
    <span class="brand-sub">Senior Care System</span>
    <h2 class="page-title">개인정보수정</h2>
  </div>

  <div class="edit-form-container">
    <div class="form-row">
      <div class="form-label">이름</div>
      <div class="form-input-wrapper">
        <input type="text" class="form-input" placeholder="이름을 입력하세요">
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">이메일</div>
      <div class="form-input-wrapper">
        <input type="email" class="form-input" placeholder="example@email.com">
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">전화번호</div>
      <div class="form-input-wrapper">
        <input type="tel" class="form-input" placeholder="010-0000-0000">
      </div>
    </div>
  </div>

  <div class="security-notice-box">
    <div class="security-icon">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </div>
    <div class="security-text">
      귀하의 모든 개인정보는 암호화 처리되며<br>안전하게 분리 보관됩니다.
    </div>
  </div>

  <div class="action-button-group">
    <button type="submit" class="primary-btn">수정하기</button>
    <button type="button" class="secondary-btn">탈퇴하기</button>
  </div>

</div>

</body>
</html>
