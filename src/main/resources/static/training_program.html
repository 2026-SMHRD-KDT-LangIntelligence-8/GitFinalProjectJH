<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지능력 훈련 리스트</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f3f1;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }

        .phone-frame {
            width: 360px;
            height: 740px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 40px;
            box-shadow: 0 16px 40px rgba(17, 56, 28, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 24px 40px 24px; /* 뒤로가기 버튼 공간을 고려해 위쪽 패딩 조정 */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 💡 뒤로가기 네비게이션 바 */
        .top-nav-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 24px;
        }

        .back-btn {
            font-size: 13.5px;
            font-weight: 600;
            color: #728a7a;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color 0.2s ease;
            padding: 4px 0;
        }

        .back-btn:hover {
            color: #2e6f40;
        }

        .back-btn svg {
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .title-container {
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .sub-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #728a7a;
            margin-bottom: 2px;
        }

        .main-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.15;
            margin: 0;
            background: linear-gradient(135deg, #11381c 30%, #23B943 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 8px rgba(17, 56, 28, 0.05));
        }

        .training-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            justify-content: center;
            margin-bottom: 30px;
        }

        .training-item {
            width: 100%;
            height: 72px;
            display: flex;
            align-items: center;
            text-decoration: none;
            border-radius: 20px;
            border: 1px solid transparent;
            padding: 0 24px;
            box-sizing: border-box;
            position: relative;
            cursor: pointer;
            background-image: linear-gradient(#f6f8f6, #f6f8f6),
                              linear-gradient(135deg, #c8d4cb 0%, #eef3f0 60%, #b3c5b8 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 0 4px 12px rgba(46, 111, 64, 0.04);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .training-text {
            font-size: 21px;
            font-weight: 800;
            color: #11381c;
            letter-spacing: -0.5px;
        }

        .arrow-icon {
            margin-left: auto;
            display: flex;
            align-items: center;
            color: #728a7a;
            transition: all 0.2s ease;
        }

        .training-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 111, 64, 0.08);
            background-image: linear-gradient(#ffffff, #ffffff),
                              linear-gradient(135deg, #2e6f40 0%, #23B943 100%);
        }

        .training-item:hover .arrow-icon {
            color: #2e6f40;
            transform: translateX(3px);
        }

        .training-item:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <!-- 뒤로가기 영역 추가 -->
    <div class="top-nav-bar">
        <a href="main.html" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            뒤로가기
        </a>
    </div>

    <div class="title-container">
        <span class="sub-badge">Cognitive Training Program</span>
        <h1 class="main-title">인지능력 훈련</h1>
    </div>

    <div class="training-list">
        <a href="#" class="training-item">
            <span class="training-text">날짜 말하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">그림 설명하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">상황 질문 답하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">규칙 기반 언어추론</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">추억 말하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>
    </div>

</div>

</body>
</html>
