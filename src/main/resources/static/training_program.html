<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지능력 훈련 리스트</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');

        /* 1. 배경 화면 스타일 */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f3f1; /* 앱 색상과 어우러지는 소프트 그린 그레이 배경 */
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
        }

        /* 2. 스마트폰 모양 틀 (360x740) */
        .phone-frame {
            width: 360px;
            height: 740px;
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 40px;
            box-shadow: 0 16px 40px rgba(17, 56, 28, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 24px 40px 24px; /* 콘텐츠 밸런스를 고려한 정밀 패딩 */
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 상단: 타이틀 구역 (매거진 타이포그래피 컨셉) */
        .title-container {
            width: 100%;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .sub-badge {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #728a7a;
            margin-bottom: 2px;
        }

        .main-title {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -1.5px;
            line-height: 1.15;
            margin: 0;

            /* 싱그러운 초록색 그라데이션 */
            background: linear-gradient(135deg, #11381c 30%, #23B943 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            filter: drop-shadow(0 2px 8px rgba(17, 56, 28, 0.05));
        }

        /* 중앙: 훈련 프로그램 리스트 컨테이너 */
        .training-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px; /* 카드 크기가 커진 만큼 밸런스를 위해 간격을 살짝 조정 */
            flex: 1;
            justify-content: center; /* 화면 중앙 배치 */
            margin-bottom: 30px;
        }

        /* 🛠️ 개별 훈련 프로그램 카드 레이아웃 (세로 높이 확대) */
        .training-item {
            width: 100%;
            height: 72px; /* 👈 기존 64px에서 72px로 카드 볼륨 대폭 확대 */
            display: flex;
            align-items: center;
            text-decoration: none;
            border-radius: 20px; /* 크기에 비례해 라운드값도 충실하게 수정 */
            border: 1px solid transparent;
            padding: 0 24px; /* 내부 가로 여백도 넓혀 안정감 부여 */
            box-sizing: border-box;
            position: relative;
            cursor: pointer;

            /* 은은하고 연한 회색 바탕 + 그라데이션 보더 효과 */
            background-image: linear-gradient(#f6f8f6, #f6f8f6),
                              linear-gradient(135deg, #c8d4cb 0%, #eef3f0 60%, #b3c5b8 100%);
            background-origin: border-box;
            background-clip: padding-box, border-box;

            box-shadow: 0 4px 12px rgba(46, 111, 64, 0.04);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 🛠️ 카드 텍스트 스타일 (폰트 크기 확대) */
        .training-text {
            font-size: 21px; /* 👈 기존 18px에서 21px로 시원하게 확대 */
            font-weight: 800;
            color: #11381c;
            letter-spacing: -0.5px;
        }

        /* 🛠️ 우측 화살표 디자인 (기본 컬러를 더 선명하고 진한 색으로 조정) */
        .arrow-icon {
            margin-left: auto;
            display: flex;
            align-items: center;
            color: #728a7a; /* 👈 기존 연한 회색(#b5c4ba)에서 훨씬 선명하고 진한 회록색으로 변경 */
            transition: all 0.2s ease;
        }

        /* 마우스 오버 / 터치 인터랙션 효과 */
        .training-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 111, 64, 0.08);
            background-image: linear-gradient(#ffffff, #ffffff),
                              linear-gradient(135deg, #2e6f40 0%, #23B943 100%);
        }

        .training-item:hover .arrow-icon {
            color: #2e6f40; /* 👈 하이라이트 시 선명한 초록색으로 변경 */
            transform: translateX(3px);
        }

        .training-item:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="phone-frame">

    <div class="title-container">
        <span class="sub-badge">Cognitive Training Program</span>
        <h1 class="main-title">인지능력 훈련</h1>
    </div>

    <div class="training-list">

        <a href="#" class="training-item">
            <span class="training-text">날짜 말하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">그림 설명하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">상황 질문 답하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">규칙 기반 언어추론</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

        <a href="#" class="training-item">
            <span class="training-text">추억 말하기</span>
            <div class="arrow-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
        </a>

    </div>

</div>

</body>
</html>
