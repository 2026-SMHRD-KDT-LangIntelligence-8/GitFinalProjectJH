# ===== 테스트 모드 (spring.profiles.active=test) =====
# 원격 캠퍼스 DB 대신 "로컬 MariaDB 테스트 DB"에 연결한다.
# 기본(default) 프로파일은 그대로 원격을 유지하므로, 이 파일은 datasource만 덮어쓴다.
# 로컬 MariaDB: 127.0.0.1:3308 / final_project_test (원격 스키마+데이터 복제본)
# 환경변수(TEST_DB_*)로 각자 로컬 설정을 덮어쓸 수 있다.
spring.datasource.url=${TEST_DB_URL:jdbc:mariadb://localhost:3308/final_project_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:1234}

# 테스트 모드 식별용 로그 (부팅 시 어떤 DB인지 명확히)
spring.application.name=final_project (TEST)
