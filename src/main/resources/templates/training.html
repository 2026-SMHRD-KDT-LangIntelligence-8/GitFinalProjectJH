<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지능력 훈련 시작</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="phone-frame training-phone-frame">
    <div class="top-nav-bar">
        <a href="/main" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            뒤로가기
        </a>
    </div>

    <div class="title-container">
        <h1 class="main-title">인지능력 훈련</h1>
        <p class="question-purpose hidden training-recipient-name" id="training-recipient-name"></p>
    </div>

    <div class="graphic-container" id="training-graphic-container">
        <svg class="center-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="75" fill="none" stroke="#2e6f40" stroke-width="1" stroke-dasharray="4 6" opacity="0.15"/>
            <circle cx="100" cy="100" r="55" fill="#f0f4f1" opacity="0.5"/>
            <path d="M95,60 C75,60 60,72 60,95 C60,112 72,125 90,128 C93,129 95,135 95,140" fill="none" stroke="#2e6f40" stroke-width="3" stroke-linecap="round"/>
            <path d="M95,75 C82,75 73,83 73,95 C73,105 82,112 90,115" fill="none" stroke="#728a7a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
            <path d="M105,60 C125,60 140,72 140,95 C140,112 128,125 110,128 C107,129 105,135 105,140" fill="none" stroke="#2e6f40" stroke-width="3" stroke-linecap="round"/>
            <path d="M105,72 C118,72 127,80 127,95 C127,107 117,116 105,118" fill="none" stroke="#23B943" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
            <line x1="100" y1="60" x2="100" y2="140" stroke="#2e6f40" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
            <line x1="60" y1="95" x2="140" y2="95" stroke="#2e6f40" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>
            <rect x="93" y="93" width="14" height="14" rx="3" fill="#23B943" transform="rotate(45 100 100)" opacity="0.95"/>
            <circle cx="100" cy="60" r="4.5" fill="#2e6f40"/>
            <circle cx="100" cy="140" r="4.5" fill="#2e6f40"/>
            <circle cx="60" cy="95" r="4.5" fill="#2e6f40"/>
            <circle cx="140" cy="95" r="4.5" fill="#23B943"/>
            <circle cx="80" cy="72" r="3.5" fill="#23B943" opacity="0.8"/>
            <circle cx="120" cy="72" r="3.5" fill="#728a7a"/>
            <circle cx="73" cy="115" r="3" fill="#728a7a"/>
            <circle cx="127" cy="115" r="4.5" fill="#23B943"/>
        </svg>
    </div>

    <p class="question-purpose hidden training-status-message" id="training-status-message"></p>

    <div class="action-container">
        <div class="dropdown-wrapper">
            <select class="select-recipient" id="recipient-select">
                <option value="" disabled selected hidden>수급자명</option>
            </select>
        </div>
        <button type="button" class="start-btn" id="start-training-btn">시작하기</button>
    </div>

</div>

<script src="/js/training.js"></script>

</body>
</html>
