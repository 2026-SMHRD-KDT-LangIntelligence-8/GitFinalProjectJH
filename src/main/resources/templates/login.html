<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>

    <!-- 공통 CSS는 static 리소스로 두고 템플릿에서 경로만 참조한다. -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="phone-frame">

    <div class="logo-box">
        <div class="logo-bg"></div>
        <!-- 로고와 카카오 아이콘은 /img/** 리소스 매핑으로 제공된다. -->
        <img class="logo-img" src="/img/logo.png" alt="서비스 로고">
        <div class="service-name">말해봄</div>
    </div>

    <div class="welcome-box">
        <h2 class="main-title">
            말 한마디로 시작하는<br>
            <span class="highlight">행복한 인지 건강 관리</span>
        </h2>

        <div class="divider"></div>

        <p class="sub-title">서비스 이용을 위해 로그인이 필요합니다</p>
    </div>

    <button class="kakao-btn" onclick="loginWithKakao()">
        <img class="kakao-icon" src="/img/icons카카오톡.png" alt="카카오톡 아이콘">
        카카오로 로그인
    </button>

</div>

<!-- 로그인 버튼 동작은 별도 JS 파일에서 관리해 템플릿과 로직을 분리한다. -->
<script src="/js/login.js"></script>

</body>
</html>
