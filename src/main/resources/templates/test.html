<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지능력 검사 시작</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="phone-frame test-phone-frame">
    <div class="top-nav-bar">
        <a href="/main" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            뒤로가기
        </a>
    </div>

    <div class="title-container">
        <h1 class="main-title">인지능력 검사</h1>
    </div>

    <!-- 검사 시작 전에는 수급자 선택 영역만 보여준다. -->
    <div class="test-intro-view" id="test-intro-view">
        <div class="graphic-container">
            <svg class="center-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <circle cx="100" cy="100" r="75" fill="none" stroke="#1a5345" stroke-width="1" stroke-dasharray="4 6" opacity="0.15"/>
                <circle cx="100" cy="100" r="55" fill="#f0f5f2" opacity="0.6"/>
                <path d="M65,115 C75,100 85,90 100,95 C115,100 125,85 135,75" fill="none" stroke="#1a5345" stroke-width="3" stroke-linecap="round"/>
                <path d="M70,125 C82,112 92,105 102,110 C118,118 128,95 140,90" fill="none" stroke="#2fa36b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
                <path d="M60,105 C72,92 85,85 95,100 C105,115 118,102 130,85" fill="none" stroke="#55776d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
                <path d="M100,75 C97,70 100,66 103,68 C106,66 109,70 106,75 L103,79 Z" fill="#2fa36b" opacity="0.8"/>
            </svg>
        </div>

        <div class="action-container">
            <div class="dropdown-wrapper">
                <select class="select-recipient" id="recipient-select">
                    <option value="" disabled selected hidden>수급자명</option>
                </select>
            </div>
            <button type="button" class="start-btn" id="start-test-btn">시작하기</button>
        </div>
    </div>

    <!-- 검사 시작 후에는 같은 페이지 안에서 문제 카드와 타이머만 갱신한다. -->
    <div class="test-session-view hidden" id="test-session-view">
        <div class="test-status-bar">
            <div class="test-status-chip" id="recipient-name-chip">수급자</div>
            <div class="test-status-chip" id="question-progress-chip">1 / 25</div>
        </div>

        <div class="test-timer-card">
            <span class="timer-label">남은 시간</span>
            <strong class="timer-value" id="question-timer">01:10</strong>
        </div>

        <div class="test-question-card">
            <div class="question-meta-row">
                <span class="question-type-badge" id="question-type-name">문항 유형</span>
                <span class="question-sequence-text hidden" id="question-sequence-text"></span>
            </div>

            <p class="question-text" id="question-text"></p>

            <p class="question-purpose hidden" id="question-purpose"></p>

            <div class="question-image-wrap hidden" id="question-image-wrap">
                <img class="question-image" id="question-image" alt="검사 문항 이미지">
            </div>

            <p class="question-criteria hidden" id="question-criteria"></p>

            <div class="question-voice-panel" id="question-voice-panel">
                <div class="question-voice-header">
                    <span class="question-voice-badge" id="question-voice-badge">음성 대기</span>
                    <span class="question-voice-guide" id="question-voice-guide">검사 시작을 누르면 마이크가 활성화됩니다.</span>
                </div>
                <div class="question-voice-transcript" id="question-voice-transcript"></div>
                <div class="question-voice-review">
                    <button type="button" class="voice-review-toggle-btn" id="voice-review-toggle-btn" disabled>
                        인식된 텍스트 확인 펼치기
                    </button>
                    <div class="voice-review-text hidden" id="voice-review-text"></div>
                </div>
            </div>
        </div>

        <div class="test-session-actions">
            <button type="button" class="timer-start-btn" id="timer-start-btn">검사 시작</button>
            <button type="button" class="next-question-btn" id="next-question-btn" disabled>넘어가기</button>
        </div>
    </div>
</div>

<script src="/js/test.js"></script>

</body>
</html>
