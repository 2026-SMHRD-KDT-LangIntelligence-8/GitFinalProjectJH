<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인지능력 검사 시작</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="phone-frame">
    <div class="top-nav-bar">
        <a href="/main" class="back-btn">
            <svg width="14" height="14" viewBox="0 0 24 24">
                <path d="M15 19l-7-7 7-7" />
            </svg>
            뒤로가기
        </a>
    </div>

    <div class="title-container">
        <h1 class="main-title">인지능력 검사</h1>
    </div>

    <div class="graphic-container">
        <svg class="center-illustration" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <circle cx="100" cy="100" r="75" fill="none" stroke="#1a5345" stroke-width="1" stroke-dasharray="4 6" opacity="0.15"/>
            <circle cx="100" cy="100" r="55" fill="#f0f5f2" opacity="0.6"/>
            <path d="M65,115 C75,100 85,90 100,95 C115,100 125,85 135,75" fill="none" stroke="#1a5345" stroke-width="3" stroke-linecap="round"/>
            <path d="M70,125 C82,112 92,105 102,110 C118,118 128,95 140,90" fill="none" stroke="#2fa36b" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
            <path d="M60,105 C72,92 85,85 95,100 C105,115 118,102 130,85" fill="none" stroke="#55776d" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
            <path d="M100,75 C97,70 100,66 103,68 C106,66 109,70 106,75 L103,79 Z" fill="#2fa36b" opacity="0.8"/>
        </svg>
    </div>

    <div class="action-container">
        <div class="dropdown-wrapper">
            <!-- 하드코딩 옵션 대신 JS가 DB 목록을 채워 넣는다. -->
            <select class="select-recipient" id="recipient-select">
                <option value="" disabled selected hidden>수급자명</option>
            </select>
        </div>
        <button type="button" class="start-btn">시작하기</button>
    </div>

</div>

<!-- 검사 시작 화면용 수급자 목록 로딩 스크립트 -->
<script src="/js/test.js"></script>

</body>
</html>
