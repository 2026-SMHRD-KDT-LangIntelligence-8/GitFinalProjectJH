<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리포트</title>

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="phone-frame report-phone-frame" id="pdf-area">

  <div class="top-nav-bar">
    <a href="/main" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24">
        <path d="M15 19l-7-7 7-7" />
      </svg>
      뒤로가기
    </a>
  </div>

  <div class="header-wrapper report-header">
    <h2 class="page-title">리포트</h2>
    <div class="report-search-wrap">
      <button type="button" class="report-search-toggle" id="report-search-toggle" aria-label="수급자명 고정"></button>
      <input type="search" class="report-recipient-search" id="report-recipient-search" placeholder="수급자명" autocomplete="off">
      <div class="report-recipient-combo" id="report-recipient-combo"></div>
    </div>
  </div>

  <div class="scroll-content">
    <div class="info-section">
      <div class="section-label-row">
        <h2 class="section-title">검사결과 조회</h2>
        <select class="select-period-box report-control-shift" id="report-history-select">
          <option value="">리포트 선택</option>
        </select>
      </div>
      <div class="card-panel report-card-panel">
        <div class="report-filter-buttons">
          <button type="button" class="report-filter-btn is-active" data-report-filter-scope="latest" data-report-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="latest" data-report-filter="오늘 날짜 말하기" aria-pressed="false">오늘 날짜 말하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="latest" data-report-filter="그림 설명하기" aria-pressed="false">그림 설명하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="latest" data-report-filter="상황 질문 답하기" aria-pressed="false">상황 질문 답하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="latest" data-report-filter="규칙 기반 언어추론" aria-pressed="false">규칙 기반 언어추론</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="latest" data-report-filter="추억 말하기" aria-pressed="false">추억 말하기</button>
        </div>
        <div class="report-summary-header" id="report-summary-header">수급자를 선택하면 최근 검사 리포트가 표시됩니다.</div>
        <div class="report-chart-wrap">
          <canvas id="latest-report-chart"></canvas>
        </div>
        <div class="report-type-summary hidden" id="report-type-summary"></div>
        <div class="report-empty-message" id="latest-report-empty">검사 분석 결과가 아직 없습니다.</div>
      </div>
      <div class="btn-align-right report-action-row">
        <button type="button" class="action-btn report-control-shift report-output-btn report-share-btn report-share-btn-js"><span class="report-output-text">공유</span></button>
        <button type="button" class="action-btn report-control-shift report-output-btn" id="report-download-btn"><span class="report-output-text">출력</span></button>
      </div>
    </div>

    <div class="info-section">
      <div class="section-label-row">
        <h2 class="section-title">기간별 변화 추이</h2>
        <select class="select-period-box report-control-shift" id="report-trend-select">
          <option value="3">최근 3일</option>
          <option value="7">최근 1주일</option>
          <option value="14">최근 2주</option>
          <option value="30">최근 1개월</option>
          <option value="60">최근 2개월</option>
          <option value="90">최근 3개월</option>
        </select>
      </div>
      <div class="card-panel report-card-panel report-card-panel-large">
        <div class="report-filter-buttons">
          <button type="button" class="report-filter-btn is-active" data-report-filter-scope="trend" data-report-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="trend" data-report-filter="오늘 날짜 말하기" aria-pressed="false">오늘 날짜 말하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="trend" data-report-filter="그림 설명하기" aria-pressed="false">그림 설명하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="trend" data-report-filter="상황 질문 답하기" aria-pressed="false">상황 질문 답하기</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="trend" data-report-filter="규칙 기반 언어추론" aria-pressed="false">규칙 기반 언어추론</button>
          <button type="button" class="report-filter-btn" data-report-filter-scope="trend" data-report-filter="추억 말하기" aria-pressed="false">추억 말하기</button>
        </div>
        <div class="report-summary-header" id="trend-summary-header">최근 기간의 검사 평균 점수 변화를 표시합니다.</div>
        <div class="report-chart-wrap report-chart-wrap-large">
          <canvas id="trend-report-chart"></canvas>
        </div>
        <div class="report-trend-feedback" id="trend-feedback"></div>
        <div class="report-trend-note">※ 점수 추이는 참고용 정보입니다.</div>
        <div class="report-empty-message" id="trend-report-empty">기간 내 그래프로 표시할 검사 결과가 없습니다.</div>
      </div>
      <div class="btn-align-right report-action-row">
        <button type="button" class="action-btn report-control-shift report-output-btn report-share-btn report-share-btn-js"><span class="report-output-text">공유</span></button>
        <button type="button" class="action-btn report-control-shift report-output-btn" id="trend-download-btn"><span class="report-output-text">출력</span></button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="/js/report.js"></script>

</body>
</html>
